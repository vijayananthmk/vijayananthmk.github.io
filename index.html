<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FDFDFB;
    --ink:#171512;
    --ink-soft:#6E6C63;
    --rule:#E6E3D9;
    --rule-strong:#CFCBBC;
    --accent:#2451C4;
    --accent-soft:#EDF1FB;
    --danger:#B3432E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    font-size:18px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:64px 24px 120px;
  }
  .sans{ font-family:'Inter', -apple-system, sans-serif; }
  .mono{ font-family:'JetBrains Mono', monospace; }

  header.site{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:56px;
  }
  .wordmark{
    font-size:19px;
    font-weight:600;
    letter-spacing:-0.01em;
    cursor:pointer;
    font-family:'Inter', sans-serif;
  }
  .wordmark span{ color:var(--ink-soft); font-weight:400; }
  nav.site a{
    font-family:'Inter', sans-serif;
    font-size:13px;
    color:var(--ink-soft);
    text-decoration:none;
    margin-left:20px;
    letter-spacing:0.02em;
    text-transform:uppercase;
    cursor:pointer;
    border-bottom:1px solid transparent;
  }
  nav.site a:hover{ color:var(--ink); border-bottom-color:var(--ink-soft); }

  /* ---- list view ---- */
  .intro{
    color:var(--ink-soft);
    font-size:16px;
    margin-bottom:48px;
    max-width:50ch;
  }
  .entries{ border-top:1px solid var(--rule); }
  .entry{
    display:grid;
    grid-template-columns:88px 1fr;
    gap:20px;
    padding:26px 0;
    border-bottom:1px solid var(--rule);
    cursor:pointer;
  }
  .entry:hover .entry-title{ color:var(--accent); }
  .entry-date{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    padding-top:4px;
    letter-spacing:0.01em;
  }
  .entry-title{
    font-size:19px;
    font-weight:500;
    margin:0 0 6px;
    color:var(--ink);
  }
  .entry-excerpt{
    font-size:15px;
    color:var(--ink-soft);
    line-height:1.6;
    margin:0;
  }
  .empty{
    padding:48px 0;
    color:var(--ink-soft);
    font-family:'Inter', sans-serif;
    font-size:14px;
    text-align:center;
    border-bottom:1px solid var(--rule);
  }

  /* ---- new post ---- */
  .composer{ margin-bottom:8px; }
  .composer-toggle{
    font-family:'Inter', sans-serif;
    font-size:13px;
    color:var(--ink-soft);
    background:none;
    border:1px solid var(--rule-strong);
    border-radius:3px;
    padding:8px 14px;
    cursor:pointer;
    margin-bottom:40px;
  }
  .composer-toggle:hover{ border-color:var(--ink-soft); color:var(--ink); }
  .composer-form{
    display:none;
    border:1px solid var(--rule-strong);
    border-radius:4px;
    padding:24px;
    margin-bottom:40px;
    background:#FBFAF6;
  }
  .composer-form.open{ display:block; }
  .composer-form label{
    display:block;
    font-family:'Inter', sans-serif;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .composer-form input[type=text], .composer-form textarea{
    width:100%;
    font-family:'Source Serif 4', serif;
    font-size:16px;
    color:var(--ink);
    background:var(--bg);
    border:1px solid var(--rule-strong);
    border-radius:3px;
    padding:10px 12px;
    margin-bottom:18px;
    resize:vertical;
  }
  .composer-form textarea{ min-height:220px; line-height:1.6; }
  .composer-actions{ display:flex; gap:10px; align-items:center; }
  .btn{
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:500;
    border-radius:3px;
    padding:9px 18px;
    cursor:pointer;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--bg);
  }
  .btn:hover{ opacity:0.85; }
  .btn-ghost{
    background:none;
    color:var(--ink-soft);
    border:1px solid transparent;
  }
  .btn-ghost:hover{ color:var(--ink); }
  .form-error{
    font-family:'Inter', sans-serif;
    font-size:12px;
    color:var(--danger);
    margin:-10px 0 14px;
    display:none;
  }

  /* ---- post view ---- */
  .post-view{ display:none; }
  .post-view.open{ display:block; }
  .list-view.hidden{ display:none; }
  .back-link{
    font-family:'Inter', sans-serif;
    font-size:13px;
    color:var(--ink-soft);
    cursor:pointer;
    margin-bottom:36px;
    display:inline-block;
  }
  .back-link:hover{ color:var(--accent); }
  .post-date{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .post-title{
    font-size:32px;
    font-weight:600;
    line-height:1.25;
    margin:0 0 28px;
    letter-spacing:-0.01em;
  }
  .post-body{
    font-size:18px;
    line-height:1.8;
    color:var(--ink);
    white-space:pre-wrap;
  }
  .post-foot{
    margin-top:48px;
    padding-top:20px;
    border-top:1px solid var(--rule);
  }
  .delete-link{
    font-family:'Inter', sans-serif;
    font-size:12px;
    color:var(--ink-soft);
    cursor:pointer;
    background:none;
    border:none;
    padding:0;
  }
  .delete-link:hover{ color:var(--danger); }

  footer.site{
    margin-top:80px;
    padding-top:20px;
    border-top:1px solid var(--rule);
    font-family:'Inter', sans-serif;
    font-size:12px;
    color:var(--ink-soft);
  }

  @media (max-width:480px){
    body{ font-size:16px; }
    .entry{ grid-template-columns:1fr; gap:4px; }
    .post-title{ font-size:26px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="site">
    <div class="wordmark" onclick="showList()">field <span>notes</span></div>
    <nav class="site">
      <a onclick="showList()">home</a>
    </nav>
  </header>

  <div id="listView" class="list-view">
    <p class="intro">Notes on markets, reading, and whatever else is worth writing down.</p>

    <button class="composer-toggle" id="composerToggle" onclick="toggleComposer()">+ New entry</button>

    <div class="composer-form" id="composerForm">
      <label for="postTitle">Title</label>
      <input type="text" id="postTitle" placeholder="Give it a title" />
      <label for="postBody">Entry</label>
      <textarea id="postBody" placeholder="Write here..."></textarea>
      <div class="form-error" id="formError">Add a title and some text before posting.</div>
      <div class="composer-actions">
        <button class="btn" onclick="publishPost()">Publish</button>
        <button class="btn btn-ghost" onclick="toggleComposer()">Cancel</button>
      </div>
    </div>

    <div class="entries" id="entriesList"></div>
    <div class="empty" id="emptyState" style="display:none;">No entries yet. Write your first one above.</div>
  </div>

  <div id="postView" class="post-view">
    <div class="back-link" onclick="showList()">&larr; back to all entries</div>
    <div class="post-date" id="postDate"></div>
    <h1 class="post-title" id="postTitle2"></h1>
    <div class="post-body" id="postBody2"></div>
    <div class="post-foot">
      <button class="delete-link" id="deleteBtn">delete this entry</button>
    </div>
  </div>

  <footer class="site">field notes &mdash; a quiet place to write</footer>
</div>

<script>
let posts = [];
let currentId = null;

function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { month:'short', day:'2-digit', year:'numeric' }).toLowerCase();
}

function excerpt(text){
  const clean = text.trim().replace(/\s+/g,' ');
  return clean.length > 120 ? clean.slice(0,120) + '\u2026' : clean;
}

async function loadPosts(){
  try{
    const result = await window.storage.get('blog:posts', false);
    posts = result ? JSON.parse(result.value) : [];
  }catch(e){
    posts = [];
  }
  render();
}

async function savePosts(){
  try{
    await window.storage.set('blog:posts', JSON.stringify(posts), false);
  }catch(e){
    console.error('Could not save', e);
  }
}

function render(){
  const list = document.getElementById('entriesList');
  const empty = document.getElementById('emptyState');
  list.innerHTML = '';
  if(posts.length === 0){
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  const sorted = [...posts].sort((a,b) => new Date(b.date) - new Date(a.date));
  sorted.forEach(p => {
    const row = document.createElement('div');
    row.className = 'entry';
    row.onclick = () => openPost(p.id);
    row.innerHTML = `
      <div class="entry-date mono">${fmtDate(p.date)}</div>
      <div>
        <p class="entry-title">${escapeHtml(p.title)}</p>
        <p class="entry-excerpt">${escapeHtml(excerpt(p.body))}</p>
      </div>
    `;
    list.appendChild(row);
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function toggleComposer(){
  const form = document.getElementById('composerForm');
  const toggle = document.getElementById('composerToggle');
  const isOpen = form.classList.toggle('open');
  toggle.style.display = isOpen ? 'none' : 'inline-block';
  if(!isOpen){
    document.getElementById('postTitle').value = '';
    document.getElementById('postBody').value = '';
    document.getElementById('formError').style.display = 'none';
  }
}

async function publishPost(){
  const title = document.getElementById('postTitle').value.trim();
  const body = document.getElementById('postBody').value.trim();
  const err = document.getElementById('formError');
  if(!title || !body){
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';
  const post = {
    id: 'p_' + Date.now(),
    title,
    body,
    date: new Date().toISOString()
  };
  posts.push(post);
  await savePosts();
  document.getElementById('postTitle').value = '';
  document.getElementById('postBody').value = '';
  toggleComposer();
  render();
}

function openPost(id){
  const p = posts.find(x => x.id === id);
  if(!p) return;
  currentId = id;
  document.getElementById('postDate').textContent = fmtDate(p.date);
  document.getElementById('postTitle2').textContent = p.title;
  document.getElementById('postBody2').textContent = p.body;
  document.getElementById('listView').classList.add('hidden');
  document.getElementById('postView').classList.add('open');
  window.scrollTo(0,0);
}

function showList(){
  currentId = null;
  document.getElementById('listView').classList.remove('hidden');
  document.getElementById('postView').classList.remove('open');
  window.scrollTo(0,0);
}

document.getElementById('deleteBtn').onclick = async () => {
  if(!currentId) return;
  posts = posts.filter(p => p.id !== currentId);
  await savePosts();
  render();
  showList();
};

loadPosts();
</script>
</body>
</html>
